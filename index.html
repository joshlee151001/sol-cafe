<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>sol-cafe</title>
<meta name="theme-color" content="#4A2C1D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="sol-cafe">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root {
  --sun: #F5A524; --sun-deep: #D9840B; --sun-light: #FFF1D9;
  --brown: #4A2C1D; --brown2: #6B4430; --cream: #FFF8EF; --card: #FFFFFF;
  --text: #2B1A10; --sub: #8A7565; --line: #F0E4D6; --input: #F7EFE5;
  --good: #1E9E5A; --bad: #E5484D; --hot: #E5484D; --ice: #2D8CE0;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; background: var(--cream); color: var(--text); overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
button { font-family: inherit; border: none; background: none; color: inherit; cursor: pointer; }
input, select { font-family: inherit; font-size: 16px; color: var(--text); -webkit-user-select: text; user-select: text; }
.hidden { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; }
.btn { height: 54px; border-radius: 16px; background: var(--sun); color: #fff; font-size: 17px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 18px; transition: transform 0.1s; }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.4; }
.btn.brown { background: var(--brown); }
.btn.ghost { background: var(--sun-light); color: var(--sun-deep); }
.btn.gray { background: var(--input); color: var(--sub); }
.btn.red { background: var(--bad); }
.btn.green { background: var(--good); }
.btn.block { width: 100%; }
.field { height: 48px; border-radius: 12px; border: 2px solid var(--line); background: #fff; padding: 0 12px; outline: none; width: 100%; }
.field:focus { border-color: var(--sun); }
.hint { font-size: 13px; color: var(--sub); line-height: 1.6; }
.msg { color: var(--bad); font-size: 13px; text-align: center; min-height: 18px; }
.toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 99; background: rgba(43,26,16,0.92); color: #fff; padding: 11px 18px; border-radius: 20px; font-size: 14px; font-weight: 700; max-width: 90%; text-align: center; pointer-events: none; }
.toast.ok { background: var(--good); }
.toast.err { background: var(--bad); }
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(30,18,10,0.55); display: flex; align-items: flex-end; justify-content: center; }
.overlay.center { align-items: center; padding: 18px; }
.sheet { width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; background: var(--card); border-radius: 26px 26px 0 0; padding: 20px 18px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; animation: up 0.22s ease-out; }
.sheet > * { flex-shrink: 0; }
.overlay.center .sheet { border-radius: 26px; max-width: 420px; }
@keyframes up { from { transform: translateY(40px); opacity: 0.5; } }
.sheet h3 { font-size: 20px; font-weight: 900; }
.pic { display: flex; align-items: center; justify-content: center; overflow: hidden; }
.pic svg, .pic img { width: 100%; height: 100%; object-fit: cover; }
.pic .emo { line-height: 1; }

/* ---------- 시작 화면 ---------- */
#start { background: radial-gradient(circle at 50% 30%, #FFD27A 0%, #F5A524 45%, #D9840B 100%); color: #fff; align-items: center; text-align: center; gap: 14px; cursor: pointer; padding: calc(16px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom)); }
.st-head { display: flex; align-items: center; gap: 10px; }
.st-head .brand { font-size: 34px; }
.ad-wrap { flex: 1; width: min(560px, 100%); position: relative; min-height: 0; }
.ad { position: absolute; inset: 0; border-radius: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 22px; opacity: 0; transform: scale(0.97); transition: opacity 0.7s, transform 0.7s; pointer-events: none; box-shadow: 0 14px 34px rgba(0,0,0,0.18); overflow: hidden; }
.ad.on { opacity: 1; transform: scale(1); pointer-events: auto; }
.ad .tag { font-size: 13px; font-weight: 900; background: rgba(255,255,255,0.28); padding: 5px 12px; border-radius: 12px; letter-spacing: 1px; }
.ad .pic { width: min(56%, 34vh); aspect-ratio: 1; border-radius: 26px; background: rgba(255,255,255,0.3); }
.ad .pic .emo { font-size: min(110px, 16vh); }
.ad h2 { font-size: clamp(24px, 4.2vh, 36px); font-weight: 900; line-height: 1.25; word-break: keep-all; text-shadow: 0 2px 0 rgba(0,0,0,0.08); }
.ad p { font-size: clamp(14px, 2.2vh, 18px); font-weight: 700; opacity: 0.95; word-break: keep-all; }
.ad .go { font-size: 14px; font-weight: 900; background: #fff; color: var(--brown); padding: 9px 16px; border-radius: 16px; margin-top: 4px; }
.ad-dots { display: flex; gap: 6px; justify-content: center; min-height: 8px; }
.ad-dots i { width: 8px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.45); transition: width 0.3s; }
.ad-dots i.on { width: 22px; background: #fff; }
.ad-empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.ad-empty .big { width: 150px; height: 150px; }
.sun-logo { width: 64px; height: 64px; }
@keyframes spin { to { transform: rotate(360deg); } }
.brand { font-size: 54px; font-weight: 900; letter-spacing: -1.5px; text-shadow: 0 4px 0 rgba(0,0,0,0.12); }
.brand small { display: block; font-size: 16px; letter-spacing: 4px; font-weight: 700; opacity: 0.9; margin-top: 2px; }
.touch { font-size: 20px; font-weight: 800; background: rgba(255,255,255,0.22); padding: 14px 26px; border-radius: 30px; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.06); background: rgba(255,255,255,0.32); } }
.where { display: flex; gap: 14px; width: min(520px, 90vw); margin: auto 0; }
.where button { flex: 1; height: 150px; border-radius: 26px; background: #fff; color: var(--brown); font-size: 22px; font-weight: 900; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 10px 24px rgba(0,0,0,0.15); transition: transform 0.1s; }
.where button:active { transform: scale(0.96); }
.where button span { font-size: 54px; }
.start-admin { position: absolute; right: 14px; top: calc(14px + env(safe-area-inset-top)); width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.18); font-size: 17px; }

/* ---------- 메뉴 ---------- */
#menu { background: var(--cream); }
.mtop { background: var(--brown); color: #fff; padding: calc(12px + env(safe-area-inset-top)) 16px 0; }
.mtop-row { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; }
.mtop .logo { font-size: 22px; font-weight: 900; flex: 1; display: flex; align-items: center; gap: 8px; }
.mtop .logo i { width: 28px; height: 28px; display: inline-block; }
.mode-chip { font-size: 13px; font-weight: 800; background: rgba(255,255,255,0.16); padding: 6px 12px; border-radius: 12px; }
.home-btn { height: 36px; padding: 0 12px; border-radius: 12px; background: rgba(255,255,255,0.12); font-size: 13px; font-weight: 800; }
.cats { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cats button { flex-shrink: 0; padding: 12px 16px 13px; font-size: 16px; font-weight: 800; color: rgba(255,255,255,0.6); border-radius: 14px 14px 0 0; }
.cats button.on { background: var(--cream); color: var(--brown); }
.grid-wrap { flex: 1; overflow-y: auto; padding: 14px 14px 20px; }
.mgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 600px) { .mgrid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 900px) { .mgrid { grid-template-columns: repeat(4, 1fr); } }
.mcard { background: var(--card); border-radius: 20px; padding: 10px 10px 12px; text-align: left; box-shadow: 0 4px 14px rgba(74,44,29,0.07); display: flex; flex-direction: column; gap: 6px; position: relative; transition: transform 0.1s; }
.mcard:active { transform: scale(0.96); }
.mcard .pic { aspect-ratio: 1; border-radius: 14px; background: var(--sun-light); }
.mcard .pic .emo { font-size: 64px; }
.mcard .nm { font-size: 15px; font-weight: 800; line-height: 1.3; word-break: keep-all; padding: 0 2px; }
.mcard .pr { font-size: 15px; font-weight: 900; color: var(--sun-deep); padding: 0 2px; }
.mcard .tags { position: absolute; top: 14px; left: 14px; display: flex; gap: 4px; }
.mcard .tag { font-size: 10px; font-weight: 900; padding: 3px 6px; border-radius: 7px; color: #fff; }
.mcard.sold { pointer-events: none; }
.mcard.sold .pic { filter: grayscale(1); opacity: 0.5; }
.mcard.sold::after { content: "품절"; position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%) rotate(-12deg); border: 3px solid var(--bad); color: var(--bad); background: rgba(255,255,255,0.9); font-size: 20px; font-weight: 900; padding: 4px 14px; border-radius: 10px; }
.cartbar { background: var(--card); box-shadow: 0 -6px 20px rgba(74,44,29,0.1); padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; max-height: 46vh; }
.cart-list { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.citem { display: flex; align-items: center; gap: 10px; background: var(--input); border-radius: 14px; padding: 8px 10px; }
.citem .pic { width: 44px; height: 44px; border-radius: 10px; background: #fff; flex-shrink: 0; }
.citem .pic .emo { font-size: 28px; }
.citem .txt { flex: 1; min-width: 0; }
.citem .txt b { display: block; font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.citem .txt span { font-size: 11px; color: var(--sub); }
.qty { display: flex; align-items: center; gap: 4px; }
.qty button { width: 30px; height: 30px; border-radius: 9px; background: #fff; font-size: 17px; font-weight: 900; }
.qty b { min-width: 22px; text-align: center; font-weight: 900; }
.citem .cp { font-size: 14px; font-weight: 900; min-width: 64px; text-align: right; }
.cart-foot { display: flex; align-items: center; gap: 10px; }
.cart-foot .sum { flex: 1; }
.cart-foot .sum span { font-size: 12px; color: var(--sub); font-weight: 700; }
.cart-foot .sum b { display: block; font-size: 24px; font-weight: 900; }
.cart-foot .btn { height: 58px; min-width: 150px; font-size: 18px; }
.cart-empty { text-align: center; color: var(--sub); font-size: 14px; padding: 6px; }

/* 옵션 창 */
.opt-top { display: flex; gap: 14px; align-items: center; }
.opt-top .pic { width: 104px; height: 104px; border-radius: 20px; background: var(--sun-light); flex-shrink: 0; }
.opt-top .pic .emo { font-size: 62px; }
.opt-top b { display: block; font-size: 22px; font-weight: 900; }
.opt-top span { font-size: 17px; font-weight: 900; color: var(--sun-deep); }
.opt-sec { display: flex; flex-direction: column; gap: 8px; }
.opt-sec h4 { font-size: 14px; font-weight: 800; color: var(--sub); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { flex: 1; min-width: 90px; height: 50px; border-radius: 14px; border: 2.5px solid var(--line); background: #fff; font-size: 15px; font-weight: 800; color: var(--text); }
.chip small { display: block; font-size: 11px; color: var(--sub); font-weight: 700; }
.chip.on { border-color: var(--sun); background: var(--sun-light); color: var(--sun-deep); }
.chip.hot.on { border-color: var(--hot); background: #FFECEC; color: var(--hot); }
.chip.ice.on { border-color: var(--ice); background: #EAF4FD; color: var(--ice); }
.opt-foot { display: flex; align-items: center; gap: 10px; position: sticky; bottom: -18px; background: #fff; padding: 10px 0 4px; }

/* 결제 */
.pay-box { text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.pay-total { font-size: 38px; font-weight: 900; color: var(--brown); }
.pay-ways { display: flex; gap: 10px; width: 100%; }
.pay-ways button { flex: 1; height: 110px; border-radius: 20px; background: var(--input); font-size: 16px; font-weight: 900; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border: 2.5px solid transparent; }
.pay-ways button span { font-size: 40px; }
.reader { width: 190px; height: 210px; position: relative; margin: 6px auto; }
.reader .slot { position: absolute; left: 20px; right: 20px; bottom: 0; height: 120px; background: #3A3F47; border-radius: 16px; }
.reader .slot::before { content: ""; position: absolute; left: 22px; right: 22px; top: 14px; height: 10px; border-radius: 5px; background: #16191D; }
.reader .light { position: absolute; right: 36px; bottom: 30px; width: 14px; height: 14px; border-radius: 50%; background: #666; }
.reader .light.on { background: #22C55E; box-shadow: 0 0 12px #22C55E; }
.reader .card { position: absolute; left: 50%; width: 120px; height: 76px; margin-left: -60px; top: -10px; border-radius: 10px; background: linear-gradient(135deg, #F5A524, #D9840B); box-shadow: 0 6px 14px rgba(0,0,0,0.25); animation: insert 1.3s ease-in-out forwards; }
.reader .card::before { content: ""; position: absolute; left: 14px; top: 22px; width: 22px; height: 16px; border-radius: 4px; background: #FFE08A; }
.reader .card::after { content: "SOL CARD"; position: absolute; right: 10px; bottom: 8px; font-size: 10px; font-weight: 900; color: rgba(255,255,255,0.9); letter-spacing: 1px; }
@keyframes insert { 60% { top: 82px; } 100% { top: 82px; } }
.phone-pay { font-size: 90px; animation: tap 1.2s ease-in-out infinite; }
@keyframes tap { 50% { transform: translateY(14px) rotate(-6deg); } }
.spinner { width: 46px; height: 46px; border-radius: 50%; border: 5px solid var(--line); border-top-color: var(--sun); animation: spin 0.8s linear infinite; }

/* 주문 완료 */
#done { background: var(--brown); color: #fff; align-items: center; justify-content: center; text-align: center; padding: 20px; gap: 14px; }
.done-check { width: 86px; height: 86px; border-radius: 50%; background: var(--good); display: flex; align-items: center; justify-content: center; font-size: 46px; animation: popin 0.4s ease-out; }
@keyframes popin { from { transform: scale(0.3); opacity: 0; } }
.done-no { font-size: 20px; font-weight: 800; opacity: 0.9; }
.done-no b { display: block; font-size: 96px; font-weight: 900; color: var(--sun); line-height: 1.05; letter-spacing: -3px; }
.receipt { background: #fff; color: var(--text); width: min(340px, 90vw); border-radius: 6px; padding: 16px 16px 20px; text-align: left; font-size: 13px; position: relative; animation: print 0.9s ease-out; max-height: 34vh; overflow-y: auto; }
.receipt::after { content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 8px; background: radial-gradient(circle at 6px 0, #fff 6px, transparent 6px) repeat-x; background-size: 12px 8px; }
@keyframes print { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
.receipt .rh { text-align: center; font-weight: 900; font-size: 16px; margin-bottom: 4px; }
.receipt .rl { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
.receipt .ro { font-size: 11px; color: var(--sub); margin: -2px 0 4px; }
.receipt hr { border: none; border-top: 1.5px dashed #ccc; margin: 8px 0; }
.done-count { font-size: 14px; opacity: 0.7; }

/* ---------- 바리스타 ---------- */
#barista { background: #2A1A10; color: #fff; }
.b-top { display: flex; align-items: center; gap: 10px; padding: calc(12px + env(safe-area-inset-top)) 16px 12px; }
.b-top h1 { font-size: 20px; font-weight: 900; flex: 1; }
.b-top .tb { height: 38px; padding: 0 12px; border-radius: 12px; background: rgba(255,255,255,0.12); font-size: 13px; font-weight: 800; }
.b-top .tb.on { background: var(--sun); }
.b-cols { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 12px 12px; overflow: hidden; }
@media (max-width: 720px) { .b-cols { grid-template-columns: 1fr; overflow-y: auto; } }
.b-col { background: rgba(255,255,255,0.06); border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 120px; }
.b-col h2 { font-size: 15px; font-weight: 900; display: flex; align-items: center; gap: 6px; padding: 4px 4px 2px; }
.b-col h2 span { background: rgba(255,255,255,0.15); border-radius: 9px; padding: 1px 8px; font-size: 13px; }
.ocard { background: #fff; color: var(--text); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; animation: popin 0.3s ease-out; }
.ocard.new { box-shadow: 0 0 0 3px var(--sun); }
.ocard .oh { display: flex; align-items: center; gap: 8px; }
.ocard .ono { font-size: 28px; font-weight: 900; color: var(--brown); }
.ocard .omode { font-size: 12px; font-weight: 900; padding: 3px 8px; border-radius: 8px; background: var(--sun-light); color: var(--sun-deep); }
.ocard .otime { margin-left: auto; font-size: 12px; color: var(--sub); font-weight: 700; }
.ocard .otime.late { color: var(--bad); }
.ocard .oit { font-size: 15px; font-weight: 800; }
.ocard .oit small { display: block; font-size: 12px; color: var(--sub); font-weight: 700; }
.ocard .oit .t { display: inline-block; font-size: 11px; font-weight: 900; color: #fff; padding: 1px 6px; border-radius: 6px; margin-right: 4px; vertical-align: 2px; }
.ocard .btn { height: 46px; font-size: 15px; }
.b-empty { color: rgba(255,255,255,0.4); text-align: center; font-size: 13px; padding: 20px 6px; }

/* ---------- 픽업 전광판 ---------- */
#board { background: #120B06; color: #fff; }
.bd-top { display: flex; align-items: center; justify-content: space-between; padding: calc(16px + env(safe-area-inset-top)) 24px 10px; }
.bd-top .logo { font-size: 26px; font-weight: 900; display: flex; align-items: center; gap: 10px; }
.bd-top .logo i { width: 36px; height: 36px; display: inline-block; }
.bd-top .clock { font-size: 22px; font-weight: 800; opacity: 0.8; }
.bd-cols { flex: 1; display: grid; grid-template-columns: 1fr 1.3fr; gap: 16px; padding: 8px 20px 20px; }
.bd-col { border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
.bd-col.wait { background: rgba(255,255,255,0.06); }
.bd-col.ready { background: linear-gradient(160deg, #F5A524, #D9840B); }
.bd-col h2 { font-size: clamp(18px, 3vw, 28px); font-weight: 900; }
.bd-nums { display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; }
.bd-nums div { min-width: 23%; flex: 0 0 auto; text-align: center; font-size: clamp(30px, 6vw, 64px); font-weight: 900; padding: 6px 12px; border-radius: 16px; font-variant-numeric: tabular-nums; }
.bd-col.wait .bd-nums div { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.8); }
.bd-col.ready .bd-nums div { background: rgba(255,255,255,0.95); color: var(--brown); animation: popin 0.4s ease-out; }
.bd-call { position: fixed; inset: 0; z-index: 60; background: rgba(18,11,6,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; animation: popin 0.3s ease-out; }
.bd-call .bell { font-size: 80px; animation: ring 0.5s ease-in-out 4; }
@keyframes ring { 25% { transform: rotate(18deg); } 75% { transform: rotate(-18deg); } }
.bd-call b { font-size: clamp(90px, 22vw, 220px); font-weight: 900; color: var(--sun); line-height: 1; letter-spacing: -4px; }
.bd-call p { font-size: clamp(20px, 4vw, 38px); font-weight: 800; }
.sound-gate { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,0.75); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 20px; }
.sound-gate b { font-size: 24px; }

/* ---------- 관리자 ---------- */
#admin { background: var(--cream); }
.a-top { background: var(--brown); color: #fff; padding: calc(12px + env(safe-area-inset-top)) 14px 0; }
.a-top-row { display: flex; align-items: center; gap: 10px; padding-bottom: 8px; }
.a-top h1 { font-size: 20px; font-weight: 900; flex: 1; }
.a-body { flex: 1; overflow-y: auto; padding: 14px 14px calc(30px + env(safe-area-inset-bottom)); }
.a-wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.arow { background: var(--card); border-radius: 16px; padding: 10px; display: flex; align-items: center; gap: 10px; }
.arow .pic { width: 54px; height: 54px; border-radius: 12px; background: var(--sun-light); flex-shrink: 0; }
.arow .pic .emo { font-size: 32px; }
.arow .txt { flex: 1; min-width: 0; }
.arow .txt b { display: block; font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.arow .txt span { font-size: 12px; color: var(--sub); }
.mini { height: 34px; min-width: 34px; padding: 0 8px; border-radius: 10px; background: var(--input); font-size: 13px; font-weight: 800; color: var(--brown2); }
.mini.red { background: #FDECEC; color: var(--bad); }
.mini.on { background: var(--bad); color: #fff; }

    const v = o.sel[g.id];
    if (g.multi) {

    } else {

let lastCalls = null;
let callQueue = [];
let calling = false;
function renderBoard() {
  const list = todayOrders();
  const wait = list.filter((o) => o.status === "new" || o.status === "making");
  const ready = list.filter((o) => o.status === "done").sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  const fill = (box, arr) => { box.replaceChildren(); for (const o of arr.slice(0, 12)) box.append(el("div", null, String(o.no))); };
  fill($("bd-wait"), wait);
  fill($("bd-ready"), ready);
  // 새로 완성됐거나 '다시 부르기'한 번호
  const calls = new Map(ready.map((o) => [o.id, o.callAt || o.doneAt || 0]));
  if (lastCalls) for (const o of ready) { const t = calls.get(o.id); if (t && t !== lastCalls.get(o.id) && nowMs() - t < 60000) callQueue.push(o.no); }
  lastCalls = calls;
  runCalls();
}
function runCalls() {
  if (calling || !callQueue.length) return;
  calling = true;
  const no = callQueue.shift();
  const box = el("div", "bd-call");
  box.innerHTML = `<div class="bell">🔔</div><b class="num">${no}</b><p>번 고객님, 주문하신 메뉴가 준비되었습니다!</p>`;
  document.body.append(box);
  beep("ding");
  setTimeout(() => beep("ding"), 900);
  speak(`${no}번 고객님, 주문하신 메뉴가 준비되었습니다.`);
  setTimeout(() => { box.remove(); calling = false; runCalls(); }, 5000);
}
function speak(text) {
  if (!soundOn) return;
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ko-KR"; u.rate = 0.95;
    const v = speechSynthesis.getVoices().find((x) => x.lang && x.lang.startsWith("ko"));
    if (v) u.voice = v;
    setTimeout(() => speechSynthesis.speak(u), 600);
  } catch (e) { /* 괜찮음 */ }
}

let actx = null;
function audio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); return actx; } catch (e) { return null; } }
function beep(kind) {
  if ((MODE === "barista" || MODE === "board") && !soundOn) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime;
  const note = (f, s, d, type = "sine", v = 0.12) => {
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t + s); g.gain.exponentialRampToValueAtTime(v, t + s + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + s + d);
    o.connect(g).connect(a.destination); o.start(t + s); o.stop(t + s + d + 0.02);
  };
  if (kind === "tick") note(1300, 0, 0.04, "sine", 0.05);
  else if (kind === "add") { note(660, 0, 0.1, "triangle"); note(990, 0.08, 0.14, "triangle"); }
  else if (kind === "pay") [523, 659, 784, 1047].forEach((f, i) => note(f, i * 0.09, 0.25, "triangle"));
  else if (kind === "ding") { note(1319, 0, 0.6, "sine", 0.2); note(1047, 0.35, 0.9, "sine", 0.2); }
  else if (kind === "order") { note(880, 0, 0.15, "square", 0.06); note(880, 0.2, 0.15, "square", 0.06); note(1175, 0.4, 0.3, "square", 0.06); }
}

function shrinkPhoto(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const S = 360, c = document.createElement("canvas");
      c.width = c.height = S;
      const s = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, S, S);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL("image/jpeg", 0.72));
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

  links.append(el("b", null, "📱 다른 화면 바로 가기"), el("div", "hint", "누르면 새 창으로 바로 열려요. 다른 기기로 보낼 땐 📤 보내기를 눌러요."));
  for (const [label, q] of [["🧾 키오스크 (손님 주문)", ""], ["☕ 바리스타 (주문 받기)", "?barista"], ["📺 픽업 전광판", "?board"]]) {
    const url = SITE + q;
    const row = el("div", "form-row");
    const go = el("a", "btn ghost", label); go.href = url; go.target = "_blank"; go.rel = "noopener"; go.style.flex = "1"; go.style.textDecoration = "none"; go.style.height = "48px"; go.style.fontSize = "15px";
    const send = el("button", "btn brown", "📤"); send.type = "button"; send.style.height = "48px"; send.title = "보내기 / 복사";
    send.onclick = async () => {
      try { if (navigator.share) { await navigator.share({ title: "sol-cafe " + label, url }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
      try { await navigator.clipboard.writeText(url); toast("주소를 복사했어요 📋", "ok"); } catch (e) { toast(url); }
    };
    row.append(go, send);
    links.append(row);
  }
  body.append(links);
  const reset = el("div", "link-box");
  reset.append(el("b", null, "🔄 처음 샘플로 되돌리기"), el("div", "hint", "메뉴, 카테고리, 옵션, 광고를 전부 지우고 처음 샘플로 바꿔요."));
  const rb = el("button", "btn red block", "샘플 메뉴로 되돌리기"); rb.type = "button";
  let sure = false;
  rb.onclick = async () => { if (!sure) { sure = true; rb.textContent = "한 번 더 누르면 바뀌어요"; return; } await Promise.all([window.scRemote.put("menu", sampleMenu()), window.scRemote.put("ads", SAMPLE_ADS), window.scRemote.put("config/cats", DEF_CATS), window.scRemote.put("config/groups", DEF_GROUPS)]); toast("샘플로 바꿨어요", "ok"); sure = false; rb.textContent = "샘플 메뉴로 되돌리기"; };
  reset.append(rb);
  body.append(reset);
}

/* =====================================================================
   시작
   ===================================================================== */
function waitRemote(timeout = 6000) {
  return new Promise((res) => {
    if (window.scRemote) return res(true);
    const t = setTimeout(() => res(false), timeout);
    addEventListener("scremote-ready", () => { clearTimeout(t); res(true); }, { once: true });
  });
}
function soundGate(text) {
  const g = el("div", "sound-gate");
  g.append(el("div", null, "🔔"), el("b", null, text), el("div", "hint", "브라우저는 화면을 한 번 눌러야 소리를 낼 수 있어요"));
  g.firstChild.style.fontSize = "70px";
  g.lastChild.style.color = "rgba(255,255,255,0.7)";
  const b = el("button", "btn", "🔊 소리 켜고 시작"); b.type = "button";
  b.onclick = () => { soundOn = true; audio(); beep("ding"); if ($("b-sound")) { $("b-sound").textContent = "🔔 소리 켜짐"; $("b-sound").classList.add("on"); } try { speechSynthesis.speak(new SpeechSynthesisUtterance("")); } catch (e) { /* 괜찮음 */ } g.remove(); };
  const no = el("button", "btn gray", "소리 없이 시작"); no.type = "button"; no.onclick = () => g.remove();
  g.append(b, no);
  document.body.append(g);
}
(async () => {
  if (MODE === "barista") { show("barista"); soundGate("바리스타 화면"); }
  else if (MODE === "board") { show("board"); boardClock(); setInterval(boardClock, 10000); soundGate("픽업 전광판"); }
  else goStart();
  if (!(await waitRemote())) { toast("서버에 연결하지 못했어요. 인터넷을 확인해 주세요", "err"); return; }
  let menuLoaded = false;
  window.scRemote.listen("menu", (v) => {
    if (v === undefined) return;
    if (v === null && !menuLoaded) { window.scRemote.put("menu", sampleMenu()); window.scRemote.put("ads", SAMPLE_ADS); window.scRemote.put("config/adsSeeded", true); menuLoaded = true; return; } // 처음엔 샘플 메뉴·광고
    menuLoaded = true;
    menu = v || {};
    if (!$("menu").classList.contains("hidden")) { renderMenu(); }
    if (!$("admin").classList.contains("hidden") && aTab === "menu") renderAMenu();
    if (!$("start").classList.contains("hidden") && !$("ad-wrap").classList.contains("hidden")) renderAds();
  });
  let configLoaded = false;
  window.scRemote.listen("config", (v) => {
    if (v === undefined) return;
    config = v || {};
    configLoaded = true;
    if (!$("menu").classList.contains("hidden")) { renderCats(); renderMenu(); }
    if (!$("admin").classList.contains("hidden") && ["cats", "opts", "menu"].includes(aTab)) setATab(aTab);
  });
  window.scRemote.listen("ads", (v) => {
    if (v === undefined) return;
    ads = v || {};
    // 예전 버전에서 넘어왔으면 샘플 광고를 한 번 넣어 줘요 (일부러 다 지운 건 그대로)
    if (v === null) setTimeout(() => { if (configLoaded && !config.adsSeeded && !Object.keys(ads).length) { window.scRemote.put("ads", SAMPLE_ADS); window.scRemote.put("config/adsSeeded", true); } }, 1200);
    if (!$("start").classList.contains("hidden") && !$("ad-wrap").classList.contains("hidden")) renderAds();
    if (!$("admin").classList.contains("hidden") && aTab === "ads") renderAAds();
  });
  window.scRemote.listen("orders", (v) => {
    if (v === undefined) return;
    orders = v || {};
    if (MODE === "barista" && !$("barista").classList.contains("hidden")) renderBarista();
    if (MODE === "board") renderBoard();
    if (!$("admin").classList.contains("hidden") && aTab === "sales") renderASales();
  });
  if (MODE === "barista") setInterval(() => { if (!$("barista").classList.contains("hidden")) renderBarista(); }, 30000);
})();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
